name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          profile=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${USERNAME}")

          repos=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/users/${USERNAME}/repos?per_page=100")

          public_repos=$(echo "$profile" | jq -r '.public_repos')
          followers=$(echo "$profile" | jq -r '.followers')
          following=$(echo "$profile" | jq -r '.following')
          stars=$(echo "$repos" | jq '[.[] | .stargazers_count] | add // 0')

          mkdir -p profile

          cat > profile/stats.svg <<EOF
          <svg width="576" height="120" viewBox="0 0 576 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
            <title id="title">GitHub Stats</title>
            <desc id="desc">GitHub profile statistics for ${USERNAME}</desc>
            <style>
              .bg { fill: #1a1b27; stroke: #e4e2e2; stroke-opacity: 0.15; }
              .title { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
              .label { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #858585; }
              .value { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
            </style>

            <rect class="bg" x="0.5" y="0.5" width="575" height="119" rx="6" />
            <text class="title" x="24" y="30">GitHub Stats</text>

            <text class="value" x="24" y="63">${public_repos}</text>
            <text class="label" x="24" y="82">Repositories</text>

            <text class="value" x="160" y="63">${followers}</text>
            <text class="label" x="160" y="82">Followers</text>

            <text class="value" x="290" y="63">${following}</text>
            <text class="label" x="290" y="82">Following</text>

            <text class="value" x="420" y="63">${stars}</text>
            <text class="label" x="420" y="82">Stars</text>
          </svg>
          EOF

      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize language names
        run: |
          sed -i 's/PLpgSQL/PL\/pgSQL/g' profile/top-langs.svg

      - name: Generate Resume Builder card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Resume-Builder-SaaS&theme=tokyonight&hide_border=true
          path: profile/resume-builder.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Expense Tracker card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=next-expense-tracker&theme=tokyonight&hide_border=true
          path: profile/expense-tracker.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate URL Shortener card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=URL-Shortener&theme=tokyonight&hide_border=true
          path: profile/url-shortener.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Portfolio card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Portfolio-website&theme=tokyonight&hide_border=true
          path: profile/portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push